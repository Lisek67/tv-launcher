<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>TV</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050507; }
  body { color: #fff; font-family: system-ui, "Segoe UI", sans-serif; }

  .hero { position: fixed; inset: 0; background-size: cover; background-position: center top; opacity: 0; transition: opacity .9s ease; z-index: 0; }
  .hero.show { opacity: 1; animation: kb 26s ease-in-out infinite alternate; }
  @keyframes kb { from { transform: scale(1.03); } to { transform: scale(1.12) translate(-1%, -1%); } }
  #shade { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.55) 28%, rgba(0,0,0,0) 55%),
                linear-gradient(to right, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 45%); }

  #info { position: fixed; left: 6vw; top: 8vh; z-index: 5; max-width: 45vw; }
  #info .in { animation: titlein .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes titlein { from { opacity: 0; transform: translateY(1.2vw); } to { opacity: 1; transform: none; } }
  #info .big { font-size: 5.6vw; font-weight: 900; line-height: .95; letter-spacing: -.02em; text-transform: uppercase; text-shadow: 0 .3vw 2vw rgba(0,0,0,.55); }
  #info img { max-height: 16vh; max-width: 38vw; display: block; filter: drop-shadow(0 .3vw 1.5vw rgba(0,0,0,.6)); }
  #info .sub { margin-top: 1.2vw; font-size: 1.5vw; font-weight: 500; opacity: .85; text-shadow: 0 .2vw 1vw rgba(0,0,0,.7); }

  #pill { position: fixed; top: 3vh; right: 3vw; z-index: 6; display: flex; align-items: center; gap: 1.8vw; padding: .8vw 1.8vw; border-radius: 2vw;
          background: rgba(60,60,60,.45); -webkit-backdrop-filter: blur(1.2vw); backdrop-filter: blur(1.2vw); }
  #wx { display: flex; align-items: center; gap: .7vw; padding-right: 1.8vw; border-right: 1px solid rgba(255,255,255,.18); }
  #wx[hidden] { display: none; }
  #wxi svg { width: 3.4vw; height: 3.4vw; display: block; }
  #wxt { font-size: 2.2vw; font-weight: 300; }
  #clk { text-align: right; }
  #dt { font-size: 1.05vw; opacity: .7; text-transform: capitalize; margin-bottom: .25vw; white-space: nowrap; }
  #tm { font-size: 2.4vw; font-weight: 300; line-height: 1; }

  #dock { position: fixed; left: 2.2vw; right: 2.2vw; top: calc(73vh - 2.4vw); height: 14vw; z-index: 2; border-radius: 2vw;
          background: rgba(40,40,40,.38); -webkit-backdrop-filter: blur(2.2vw) saturate(1.4); backdrop-filter: blur(2.2vw) saturate(1.4);
          box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
  #rows { position: fixed; left: 0; right: 0; top: 73vh; z-index: 3; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .row { position: relative; display: flex; gap: 1.5vw; padding-left: 4.6vw; margin-bottom: 4.6vw; perspective: 1200px;
         transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .5s; }
  .row.gone { opacity: 0; pointer-events: none; }

  a.tile { position: relative; flex: 0 0 13.6vw; height: 8.16vw; display: block; text-decoration: none; color: #fff; outline: none;
           transform-style: preserve-3d; transform: scale(1) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
           transition: transform .35s cubic-bezier(.2,.8,.2,1);
           animation: rise .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 60ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(2.5vw) scale(.94); } to { opacity: 1; } }
  a.tile .face { position: absolute; inset: 0; border-radius: 1.3vw; overflow: hidden; box-shadow: 0 .6vw 1.4vw rgba(0,0,0,.4); transition: box-shadow .35s; }
  a.tile .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  a.tile .nm { position: absolute; inset: 0; display: flex; flex-direction: column; gap: .4vw; align-items: center; justify-content: center;
               font-size: 1.7vw; font-weight: 800; text-shadow: 0 .2vw .8vw rgba(0,0,0,.45); text-align: center; padding: 0 .8vw; }
  a.tile .nm svg { width: 2.8vw; height: 2.8vw; }
  a.tile.hasimg .nm { display: none; }
  a.tile .shine { position: absolute; inset: 0; pointer-events: none; opacity: 0;
                  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.4) 47%, transparent 62%);
                  background-size: 260% 100%; background-position: 130% 0; }
  a.tile .label { position: absolute; left: -2vw; right: -2vw; top: calc(100% + 1.1vw); text-align: center; font-size: 1.05vw; font-weight: 600;
                  opacity: 0; transform: translateY(-.4vw); transition: opacity .3s, transform .3s; text-shadow: 0 .1vw .6vw rgba(0,0,0,.6); }
  a.tile:focus, a.tile.hover { transform: scale(1.13) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); z-index: 4; }
  a.tile:focus .face, a.tile.hover .face { box-shadow: 0 1.8vw 3.4vw rgba(0,0,0,.65), 0 0 0 .2vw rgba(255,255,255,.85); }
  a.tile:focus .shine, a.tile.hover .shine { opacity: 1; animation: sweep 1.1s ease .1s 1 both; }
  @keyframes sweep { from { background-position: 130% 0; } to { background-position: -30% 0; } }
  a.tile:focus .label, a.tile.hover .label { opacity: 1; transform: none; }
  a.tile:focus { animation: rise .01s both, bob 3.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -.3vw; } }
  a.tile.launch { transform: scale(2.4); opacity: 0; transition: transform .35s ease-in, opacity .35s ease-in; z-index: 10; animation: none; }
  body.leaving #info, body.leaving #pill, body.leaving #dock { opacity: 0; transition: opacity .25s; }

  /* ustawienia – styl Apple TV */
  #set { position: fixed; inset: 0; z-index: 50; display: none; overflow: hidden; color: #fff;
         background: radial-gradient(ellipse at 28% 18%, #30323a 0%, #1a1b1f 62%, #121316 100%); }
  body.settings-open #set { display: block; }
  #sTitle { position: absolute; top: 5vh; left: 0; right: 0; text-align: center; font-size: 3.1vw; font-weight: 700; color: rgba(255,255,255,.42); letter-spacing: -.01em; }
  #sBack { position: absolute; top: 5.6vh; left: 3vw; font: inherit; font-size: 1.4vw; padding: .5vw 1.2vw; border-radius: 2vw; color: #fff; border: 0; cursor: pointer; background: rgba(255,255,255,.12); }
  #sBack[hidden], #dlg[hidden] { display: none; }
  #sLeft { position: absolute; left: 5vw; width: 44vw; top: 19vh; display: flex; flex-direction: column; align-items: center; }
  #sIcon { width: 27vw; height: 27vw; border-radius: 6.2vw; display: flex; align-items: center; justify-content: center;
           background: linear-gradient(160deg, #6d6e73, #4c4d52); box-shadow: 0 2vw 5vw rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08); }
  #sIcon svg { width: 11vw; height: 11vw; }
  #sDesc { margin-top: 2.6vw; font-size: 1.5vw; line-height: 1.4; text-align: center; max-width: 34vw; min-height: 5vw; color: rgba(255,255,255,.92); }
  #sRight { position: absolute; left: 55vw; right: 3.5vw; top: 14vh; bottom: 0; overflow-y: auto; padding: 1.2vh .8vw 16vh; scrollbar-width: none;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 3vh, #000 calc(100% - 10vh), transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 3vh, #000 calc(100% - 10vh), transparent 100%); }
  #sRight::-webkit-scrollbar { display: none; }
  .ssec { font-size: 1.05vw; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; margin: 2.2vw 0 .6vw 1vw; color: rgba(255,255,255,.82); }
  .ssec:first-child { margin-top: .4vw; }
  .snote { font-size: 1.2vw; line-height: 1.4; color: rgba(255,255,255,.6); margin: .5vw 1vw 1vw; }
  .srow { display: flex; align-items: center; gap: 1vw; min-height: 3.6vw; padding: 0 1.2vw; margin-bottom: .75vw; border-radius: .9vw; font-size: 1.8vw; outline: none; cursor: pointer;
          background: rgba(255,255,255,.1); transition: transform .18s ease, background .18s ease, box-shadow .18s ease, color .18s ease; }
  .srow:focus, .srow:focus-within { background: #fff; color: #111; transform: scale(1.025); box-shadow: 0 1.1vw 2.6vw rgba(0,0,0,.5); position: relative; z-index: 2; }
  .srow .sl { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .sv { color: rgba(255,255,255,.55); max-width: 24vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow:focus .sv, .srow:focus-within .sv { color: rgba(0,0,0,.5); }
  .srow .sc { font-size: 2.2vw; line-height: 1; opacity: .55; margin-left: -.2vw; }
  .srow .sk { font-weight: 700; }
  .srow input { flex: 0 1 22vw; min-width: 0; background: transparent; border: 0; outline: 0; color: inherit; font: inherit; text-align: right; }
  .srow input::placeholder { color: rgba(140,140,150,.8); }
  .srow input[type=color] { flex: none; width: 4vw; height: 2.2vw; padding: 0; border-radius: .4vw; cursor: pointer; }
  .srow.primary { justify-content: center; background: #2f6df6; }
  .srow.primary:focus { background: #fff; }
  #sFlash { position: absolute; left: 55vw; right: 4vw; bottom: 2.6vh; font-size: 1.25vw; color: rgba(255,255,255,.8); text-align: center; pointer-events: none; }
  #dlg { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); -webkit-backdrop-filter: blur(1.4vw); backdrop-filter: blur(1.4vw); }
  .dbox { width: 38vw; padding: 2.6vw; border-radius: 1.8vw; text-align: center; background: #2c2d32; box-shadow: 0 2vw 6vw rgba(0,0,0,.6); }
  #dT { font-size: 2vw; font-weight: 700; margin-bottom: .8vw; }
  #dX { font-size: 1.4vw; color: rgba(255,255,255,.75); line-height: 1.4; }
  #dC { font-size: 1.15vw; color: rgba(255,255,255,.5); margin-top: .8vw; min-height: 1.5vw; }
  .dbtns { display: flex; flex-direction: column; gap: .7vw; margin-top: 1.6vw; }
  .dbtns button { font: inherit; font-size: 1.7vw; padding: .9vw; border-radius: .9vw; border: 0; cursor: pointer; color: #fff; background: rgba(255,255,255,.12); outline: none; }
  .dbtns button:focus { background: #fff; color: #111; transform: scale(1.03); }

  /* kreator konfiguracji – styl Apple TV */
  #wz { position: fixed; inset: 0; z-index: 60; display: none; color: #fff;
        background: radial-gradient(ellipse at 28% 18%, #30323a 0%, #1a1b1f 62%, #121316 100%); }
  body.wz-open #wz { display: flex; }
  .wzIn { margin: auto; display: flex; align-items: center; gap: 5vw; width: 84vw; }
  #wzIcon { flex: none; width: 24vw; height: 24vw; border-radius: 5.6vw; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(160deg, #6d6e73, #4c4d52); box-shadow: 0 2vw 5vw rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08); }
  #wzIcon svg { width: 10vw; height: 10vw; }
  .wzMain { flex: 1 1 auto; min-width: 0; }
  #wzT { font-size: 3.3vw; font-weight: 700; letter-spacing: -.01em; }
  #wzB { margin-top: 1.3vw; font-size: 1.5vw; line-height: 1.5; color: rgba(255,255,255,.86); }
  #wzB p { margin: 0 0 .9vw; }
  .wzMut { color: rgba(255,255,255,.55); }
  .wzOk { color: #7ee787; font-weight: 600; } .wzBad { color: #ff9b93; font-weight: 600; }
  .wzKeys { display: grid; grid-template-columns: max-content 1fr; gap: .8vw 1.5vw; align-items: center; margin-top: .6vw; }
  .kc { display: inline-block; margin-right: .35vw; min-width: 2.6vw; padding: .3vw .8vw; border-radius: .6vw; background: rgba(255,255,255,.14);
        box-shadow: inset 0 -.15vw 0 rgba(0,0,0,.35); font-weight: 700; font-size: 1.3vw; text-align: center; white-space: nowrap; }
  .wzBig { font-size: 2.4vw; font-weight: 700; letter-spacing: .02em; word-break: break-all; }
  .wzPath { font-family: ui-monospace, monospace; font-size: 1.25vw; padding: .5vw .9vw; border-radius: .6vw; background: rgba(255,255,255,.1); word-break: break-all; display: inline-block; }
  .wzBtns { display: flex; flex-wrap: wrap; gap: .9vw; margin-top: 1.8vw; }
  .wzBtns button { font: inherit; font-size: 1.55vw; padding: .75vw 2.1vw; border: 0; border-radius: .9vw; color: #fff; background: rgba(255,255,255,.12); cursor: pointer; outline: none; }
  .wzBtns button.pri { background: #2f6df6; }
  .wzBtns button:focus { background: #fff; color: #111; transform: scale(1.04); box-shadow: 0 1.1vw 2.6vw rgba(0,0,0,.5); }
  #wzDots { position: absolute; bottom: 5vh; left: 0; right: 0; display: flex; justify-content: center; gap: .8vw; }
  #wzDots i { width: .7vw; height: .7vw; border-radius: 50%; background: rgba(255,255,255,.25); }
  #wzDots i.on { background: #fff; }
  #toast { position: fixed; left: 50%; bottom: 4vh; transform: translateX(-50%); z-index: 40; padding: .8vw 1.8vw; border-radius: 1vw; font-size: 1.4vw; background: rgba(30,30,34,.92); color: #fff; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.on { opacity: 1; }
  #wzHint { position: absolute; bottom: 1.6vh; left: 0; right: 0; text-align: center; font-size: 1vw; color: rgba(255,255,255,.4); }
</style>
</head>
<body>
<div class="hero" id="h0"></div>
<div class="hero" id="h1"></div>
<div id="shade"></div>
<div id="info"></div>
<div id="pill">
  <div id="wx" hidden><span id="wxi"></span><span id="wxt"></span></div>
  <div id="clk"><div id="dt"></div><div id="tm"></div></div>
</div>
<div id="dock"></div>
<div id="rows"></div>

<div id="set">
  <button id="sBack" hidden>‹ Wstecz</button>
  <div id="sTitle">Ustawienia</div>
  <div id="sLeft"><div id="sIcon"></div><div id="sDesc"></div></div>
  <div id="sRight"><div id="sList"></div></div>
  <div id="sFlash"></div>
  <div id="dlg" hidden><div class="dbox"><div id="dT"></div><div id="dX"></div><div id="dC"></div>
    <div class="dbtns"><button id="dOk"></button><button id="dNo"></button></div></div></div>
</div>

<div id="toast"></div>
<div id="wz">
  <div class="wzIn"><div id="wzIcon"></div><div class="wzMain"><div id="wzT"></div><div id="wzB"></div><div class="wzBtns" id="wzBtns"></div></div></div>
  <div id="wzDots"></div>
  <div id="wzHint">← → zmiana kroku · ↑ ↓ wybór przycisku · Enter potwierdź</div>
</div>

<script>
/* ===== DOMYŚLNE KAFELKI (własne dodajesz w Ustawieniach) ===== */
const DEFAULT_ROWS = [
  [
    { id: "youtube", name: "YouTube",     sub: "Filmy i kanały",            url: "https://www.youtube.com/tv",   c1: "#ff3b30", c2: "#4a0703" },
    { id: "netflix", name: "Netflix",     sub: "Filmy i seriale",           url: "https://www.netflix.com",      c1: "#e50914", c2: "#120203" },
    { id: "hbo",     name: "HBO Max",     sub: "Seriale i filmy HBO",       url: "https://play.max.com",         c1: "#7a3cff", c2: "#1d0847" },
    { id: "prime",   name: "Prime Video", sub: "Filmy i seriale Amazon",    url: "https://www.primevideo.com",   c1: "#1fb6f2", c2: "#05304f" },
    { id: "disney",  name: "Disney+",     sub: "Disney, Marvel, Star Wars", url: "https://www.disneyplus.com",   c1: "#1c49e0", c2: "#08133f" },
    { id: "spotify", name: "Spotify",     sub: "Muzyka i podcasty",         url: "https://open.spotify.com",     c1: "#1ed760", c2: "#06361a" }
  ],
  [
    { id: "twitch",  name: "Twitch",      sub: "Transmisje na żywo",        url: "https://www.twitch.tv",        c1: "#9146ff", c2: "#2a0e5c" },
    { id: "tvp",     name: "TVP VOD",     sub: "Telewizja na życzenie",     url: "https://vod.tvp.pl",           c1: "#2a3f9e", c2: "#090f30" },
    { id: "player",  name: "Player",      sub: "Seriale i programy TV",     url: "https://www.player.pl",        c1: "#ff4d4d", c2: "#4a0808" }
  ],
  [
    { id: "google",  name: "Google",      sub: "Wyszukiwarka",              url: "https://www.google.com",       c1: "#4285f4", c2: "#0e2a5e" },
    { id: "pogoda",  name: "Pogoda",      sub: "Mapa pogodowa Windy",       url: "https://www.windy.com",        c1: "#00b4d8", c2: "#022a5e" },
    { id: "mapy",    name: "Mapy",        sub: "Mapy Google",               url: "https://www.google.com/maps",  c1: "#34a853", c2: "#0b3318" }
  ]
];
const GEAR = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff"><circle cx="12" cy="12" r="9" stroke-width="3" stroke-dasharray="3.53 3.53"/><circle cx="12" cy="12" r="6.5" stroke-width="2.4"/><circle cx="12" cy="12" r="2.3" stroke-width="2"/></svg>';
const PWR = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>';
const POWERTILE = { id: "power", name: "Zasilanie", sub: "Wyłącz lub uruchom ponownie", url: "#", special: true, c1: "#7f1d1d", c2: "#2a0a0a" };
const SETTINGS = { id: "settings", name: "Ustawienia", sub: "Czas, pogoda i kafelki", url: "#", special: true, c1: "#6b7280", c2: "#1f2937" };

const $ = id => document.getElementById(id);
const post = (path, obj) => fetch(path, { method: 'POST', headers: { 'X-TV': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });
const save = () => post('/api/config', cfg);
let cfg = {};

/* ---------- ładowanie obrazków ---------- */
const probe = urls => new Promise(res => {
  let i = 0;
  const next = () => {
    if (i >= urls.length) return res(null);
    const im = new Image();
    im.onload = () => res(urls[i]);
    im.onerror = () => { i++; next(); };
    im.src = urls[i];
  };
  next();
});
const ex = (n, l) => l.map(e => `img/${n}.${e}`);
function putImg(a, src, contain) {
  const im = new Image(); im.src = src; im.alt = '';
  if (contain) { im.style.objectFit = 'contain'; im.style.padding = '12%'; }
  const face = a.querySelector('.face');
  face.insertBefore(im, face.firstChild);
  a.classList.add('hasimg');
}

/* ---------- budowanie kafelków ---------- */
const rowsEl = $('rows');
const rowEls = [], grid = [];
let ROWS = [], k = 0, r = 0, c = 0, sel = null;
const settingsOpen = () => document.body.classList.contains('settings-open');

function build() {
  rowsEl.innerHTML = ''; rowEls.length = 0; grid.length = 0; k = 0;
  const base = (cfg.rows || DEFAULT_ROWS).filter(x => x.length);
  const rows = base.map(row => row.map(it => ({ ...it })));
  if (!rows.length) rows.push([]);
  rows[rows.length - 1].push({ ...SETTINGS }, { ...POWERTILE });
  ROWS = rows;

  ROWS.forEach((items, ri) => {
    const rowEl = document.createElement('div'); rowEl.className = 'row';
    grid[ri] = [];
    items.forEach((it, ci) => {
      const a = document.createElement('a');
      a.className = 'tile'; a.href = it.url || '#'; a.style.setProperty('--i', k++);
      a.dataset.r = ri; a.dataset.c = ci;
      a.innerHTML = '<div class="face"><span class="nm"></span><div class="shine"></div></div><div class="label"></div>';
      const nm = a.querySelector('.nm');
      if (it.special) { nm.innerHTML = it.id === 'power' ? PWR : GEAR; const sp = document.createElement('span'); sp.textContent = it.name; nm.appendChild(sp); }
      else nm.textContent = it.name;
      a.querySelector('.label').textContent = it.name;
      a.querySelector('.face').style.background = `linear-gradient(135deg, ${it.c1}, ${it.c2})`;
      it.el = a; rowEl.appendChild(a); grid[ri][ci] = a;

      if (it.icon) {
        it.tile = it.icon;
        if (it.fit === 'cover') putImg(a, it.icon, false);                       // ikonka jako okładka
        else { it.logo = it.icon; it.noHero = true; putImg(a, it.icon, true); }  // logo na kolorze
      }
      else if (!it.special && !it.custom) {
        probe(ex(it.id, ['jpg','png','webp'])).then(src => { if (src) { putImg(a, src); it.tile = src; refresh(it); } });
        if (!it.splash) probe(ex(it.id + '-bg', ['jpg','png','webp'])).then(src => { if (src) { it.bg = src; refresh(it); } });
        probe(ex(it.id + '-logo', ['png','webp','svg'])).then(src => { if (src) { it.logo = src; refresh(it); } });
      }
      if (it.splash) it.bg = it.splash;   // własny splash ma pierwszeństwo
      wire(a);
    });
    rowsEl.appendChild(rowEl); rowEls[ri] = rowEl;
  });

  r = Math.min(r, ROWS.length - 1); c = Math.min(c, ROWS[r].length - 1);
  select(r, c, true, settingsOpen(), true);
}

function wire(t) {
  t.addEventListener('mouseenter', () => { if (+t.dataset.r === r && !settingsOpen()) select(+t.dataset.r, +t.dataset.c); });
  t.addEventListener('mousemove', ev => {
    const b = t.getBoundingClientRect();

function mkRow(it) {

  el.appendChild(mk('span', 'sl', it.label));

  let chk = null;

    const i = document.createElement('input'); i.type = it.input; i.value = it.val ? it.val() : ''; i.placeholder = it.ph || ''; i.spellcheck = false; i.autocomplete = 'off';
    i.oninput = () => it.set && it.set(i.value); row.input = i; row.kind = 'text'; el.appendChild(i);
  } else if (it.file) {

    i.onchange = () => { it.set(i.files[0] || null); updateAll(); }; row.input = i; row.kind = 'file'; el.appendChild(i); el.appendChild(sv);
  } else if (it.color) {

  } else {

const syncHomeKey = () => window.postMessage({ tvLauncher: 'setkey', combo: cfg.homeKey || null }, location.origin);
function comboError(c) {
  const sig = [c.ctrl && 'ctrl', c.alt && 'alt', c.shift && 'shift', c.code].filter(Boolean).join('+');
  if (['ctrl+KeyT', 'ctrl+KeyN', 'ctrl+KeyW', 'ctrl+shift+KeyN', 'ctrl+shift+KeyT', 'ctrl+shift+KeyW', 'alt+F4'].includes(sig)) return 'Ta kombinacja jest zarezerwowana przez przeglądarkę. Wybierz inną.';
  const plain = !c.ctrl && !c.alt && !c.meta;
  if (plain && !/^(F\d{1,2}|Browser\w+|Media\w+|Launch\w+|Pause|ScrollLock|PrintScreen|ContextMenu)$/.test(c.code))
    return 'Taki klawisz przeszkadzałby w pisaniu i nawigacji. Użyj F1–F12, klawisza multimedialnego albo kombinacji z Ctrl/Alt.';
  return '';
}
function captureKey() {
  return new Promise(res => {
    const d = $('dlg'), ok = $('dOk'), no = $('dNo');
    $('dT').textContent = 'Przypisz skrót';
    $('dX').textContent = 'Naciśnij klawisz lub kombinację (np. F9 albo Ctrl+H). Alt+Home i klawisz Strona domowa nadal działają. Esc anuluje.';
    $('dC').textContent = ''; ok.style.display = 'none'; no.textContent = 'Anuluj'; d.hidden = false; no.focus();
    const done = v => { document.removeEventListener('keydown', onKey, true); d.hidden = true; ok.style.display = ''; dlgFin = null; res(v); };
    dlgFin = () => done(null); no.onclick = () => done(null);
    const onKey = e => {
      if (e.key === 'Escape') return;                                   // obsłuży istniejący handler (anuluj)
      if (['Control', 'Alt', 'Shift', 'Meta'].includes(e.key)) return;  // czekamy na właściwy klawisz
      e.preventDefault(); e.stopImmediatePropagation();
      const c = { code: e.code, ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey, meta: e.metaKey };
      const name = e.key.length === 1 ? e.key.toUpperCase() : e.key === ' ' ? 'Spacja' : e.code.startsWith('Browser') ? 'Klawisz ' + e.code.slice(7) : e.key;
      c.label = [c.ctrl && 'Ctrl', c.alt && 'Alt', c.shift && 'Shift', c.meta && 'Meta', name].filter(Boolean).join('+');
      const err = comboError(c);
      if (err) { $('dC').textContent = err; return; }
      done(c);
    };
    document.addEventListener('keydown', onKey, true);
  });
}

const UPDI = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19.5h14"/></svg>';
let INFO = {}, UPD = null, updPrompted = '';
const osLetter = () => INFO.os === 'windows' ? 'W' : 'L';   // L = Linux, W = Windows
const checkUpdate = async force => { UPD = await getJ('/api/update/check' + (force ? '?force=1' : '')); return UPD; };
function fmtNotes(txt) {
  const out = [];
  (txt || '').split('\n').forEach(l => {
    l = l.trim().replace(/[*_`]/g, ''); if (!l) return;
    const h = l.match(/^#{1,6}\s*(.+)$/);
    if (h) { if (!/co nowego|changelog|zmiany/i.test(h[1])) out.push({ sec: h[1] }); } else out.push({ text: /^[-+]\s+/.test(l) ? '• ' + l.replace(/^[-+]\s+/, '') : l });
  });
  return out.slice(0, 20);
}
async function doUpdate(u) {
  if (!await ask('Zaktualizować do v' + u.latest + '?', 'Launcher pobierze nową wersję i uruchomi się ponownie. Twoje kafelki i ustawienia zostają bez zmian.', 'Aktualizuj', 'Anuluj', 0, false)) return;
  flash('Pobieram i instaluję…');
  const j = await postJ('/api/update/apply');
  if (!j.ok) { flash('✗ ' + (j.msg || 'Aktualizacja się nie udała')); return; }
  try { localStorage.setItem('tvPostUpdate', j.version); } catch (e) {}
  flash('✓ Zainstalowano v' + j.version + '. Uruchamiam ponownie…');
  await new Promise(r => setTimeout(r, 2600));
  for (let i = 0; i < 60; i++) {
    try { const r = await fetch('/ping', { cache: 'no-store' }); if (r.ok) { location.reload(); return; } } catch (e) {}
    await new Promise(r => setTimeout(r, 1000));
  }
  flash('Odśwież stronę ręcznie (F5).');
}

    { label: 'Uruchom ponownie', primary: true, onEnter: async () => {
      flash('Restartuję…');
      const j = await postJ('/api/power', { action: 'reboot' });
      if (!j.ok) flash('✗ ' + (j.msg || 'Nie udało się zrestartować'));
    } },
    { label: 'Później', onEnter: closeSet }
  ] };
}
async function startupUpdateCheck() {
  if (cfg.autoUpdate === false) return;
  const u = await checkUpdate(false);
  if (u && u.available && cfg.skipVersion !== u.latest && updPrompted !== u.latest && !settingsOpen() && !document.body.classList.contains('wz-open')) {
    updPrompted = u.latest; openPage(updatePage(true), UPDI);
  }
}

/* ---------- kreator konfiguracji ---------- */
const esc = x => String(x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const WI = p => '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
const ICON = {
  hello: WI('<path d="M12 3l2 5.5 5.5 2-5.5 2-2 5.5-2-5.5-5.5-2 5.5-2z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>'),
  nav: WI('<circle cx="12" cy="12" r="9"/><path d="M12 6.5l-2 2.5h4zM12 17.5l-2-2.5h4zM6.5 12l2.5-2v4zM17.5 12l-2.5-2v4z" fill="#fff"/>'),
  apps: WI('<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>'),
  gear: GEAR,
  phone: WI('<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>'),
  puzzle: WI('<path d="M9 4h3v2a1.5 1.5 0 1 0 3 0V4h3v4h-2a1.5 1.5 0 1 0 0 3h2v4h-4v-2a1.5 1.5 0 1 0-3 0v2H9v-4H7a1.5 1.5 0 1 1 0-3h2z"/>'),
  done: WI('<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16.5 9.5"/>')
};
let wzStep = 0, wzSteps = [];
const kc = t => '<span class="kc">' + esc(t) + '</span>';
function wzBuild() {
  const win = INFO.os === 'windows', ext = document.documentElement.dataset.tvext === '1';
  const openS = () => { wzFinish(); openSet(); };
  wzSteps = [
    { icon: ICON.hello, title: 'Witaj w TV Launcher', skip: true,
      body: () => '<p>Ten krótki kreator pokaże, jak korzystać z launchera i co warto ustawić. Zajmie około minuty.</p><p class="wzMut">Wersja ' + esc(INFO.version || '') + ' · Twórca: ' + esc(INFO.creator || 'lissszek') + '</p>' },
    { icon: ICON.nav, title: 'Poruszanie się',
      body: () => '<div class="wzKeys"><div>' + kc('←') + kc('↑') + kc('→') + kc('↓') + '</div><div>Przesuwanie po kafelkach i opcjach</div>' +
        '<div>' + kc('Enter') + '</div><div>Otwórz aplikację lub wybierz opcję</div>' +
        '<div>' + kc('Esc') + kc('Backspace') + '</div><div>Wróć o krok w ustawieniach</div>' +
        '<div>' + kc('Alt+Home') + (cfg.homeKey ? kc(cfg.homeKey.label) : '') + '</div><div>Wróć do launchera z dowolnej aplikacji (aplikacja zostaje otwarta). Własny skrót ustawisz w Ustawieniach.</div></div>' },
    { icon: ICON.apps, title: 'Aplikacje i kafelki',
      body: () => '<p>Wybierz aplikację i naciśnij Enter. Otworzy się w osobnej karcie, a po powrocie do launchera wystarczy kliknąć ją ponownie, żeby wznowić dokładnie w tym samym miejscu.</p><p>Własne kafelki dodasz w <b>Ustawienia → Kafelki i aplikacje</b>: adres strony, kolory, ikonka i tło.</p>' },
    { icon: ICON.gear, title: 'Co warto ustawić',
      body: () => '<div class="wzKeys">' + (win ? '' : '<div><b>Ekran</b></div><div>Rozdzielczość i odświeżanie</div><div><b>Czas i data</b></div><div>Strefa czasowa i czas z internetu</div>') +
        '<div><b>Pogoda</b></div><div>Miejscowość do widżetu pogody</div><div><b>Kafelki</b></div><div>Twoje aplikacje i strony</div></div>' +
        '<p class="wzMut" style="margin-top:1vw">Ustawienia to kafelek w ostatnim rzędzie, obok Zasilania.</p>',
      actions: [{ label: 'Otwórz Ustawienia', fn: openS }] },
    { icon: ICON.phone, title: 'Pilot na telefonie', load: async () => ({ r: await getJ('/api/remote') || {} }),
      body: d => d.r.pin ? '<p>Na telefonie w tej samej sieci Wi-Fi otwórz adres:</p><p class="wzBig">' + esc(d.r.url) + '</p><p>i wpisz kod PIN:</p><p class="wzBig">' + esc(d.r.pin) + '</p><p class="wzMut">Dostaniesz strzałki, gładzik, głośność, klawiaturę i zasilanie. Adres i PIN znajdziesz też w Ustawieniach.</p>'
        : '<p class="wzBad">Pilot na telefon nie odpowiada.</p><p class="wzMut">Zrestartuj launcher i spróbuj ponownie.</p>' },
    { icon: ICON.puzzle, title: 'Rozszerzenie przeglądarki',
      body: () => ext ? '<p class="wzOk">✓ Rozszerzenie działa.</p><p>Aplikacje zapamiętują miejsce, w którym skończyłeś, a ' + kc('Alt+Home') + ' wraca do launchera.</p>'
        : '<p class="wzBad">✗ Rozszerzenie nie jest załadowane.</p><p>Bez niego powrót do aplikacji będzie ją ładował od nowa. Jednorazowo: otwórz <b>brave://extensions</b> (albo chrome:// / edge://extensions), włącz <b>Tryb dewelopera</b>, kliknij <b>Wczytaj rozpakowane</b> i wskaż folder:</p><p><span class="wzPath">' + esc(INFO.ext_dir || 'tv-ua') + '</span></p><p class="wzMut">Potem odśwież launcher (F5).</p>' },
    { icon: ICON.done, title: 'Gotowe!', last: true,
      body: () => '<p>Launcher sam sprawdza aktualizacje. Gdy pojawi się nowa wersja, zobaczysz listę zmian i zapytanie, czy zaktualizować.</p><p>Kreator wrócisz w <b>Ustawienia → Samouczek</b>.</p><p class="wzMut">TV Launcher v' + esc(INFO.version || '') + ' · Twórca: ' + esc(INFO.creator || 'lissszek') + '</p>' }
  ];
}
async function wzShow(i) {
  wzStep = Math.max(0, Math.min(wzSteps.length - 1, i));
  const st = wzSteps[wzStep], tok = ++wzShow.tok;
  $('wzIcon').innerHTML = st.icon;
  $('wzT').textContent = st.title;
  $('wzDots').innerHTML = wzSteps.map((_, k) => '<i' + (k === wzStep ? ' class="on"' : '') + '></i>').join('');
  $('wzB').innerHTML = st.load ? '<p class="wzMut">Ładowanie…</p>' : st.body();
  const bt = $('wzBtns'); bt.innerHTML = '';
  const add = (label, fn, pri) => { const b = document.createElement('button'); b.textContent = label; if (pri) b.className = 'pri'; b.onclick = fn; bt.appendChild(b); return b; };
  const first = st.last ? add('Zaczynamy', wzFinish, true) : add('Dalej', () => wzShow(wzStep + 1), true);
  (st.actions || []).forEach(a => add(a.label, a.fn));
  if (wzStep > 0) add('Wstecz', () => wzShow(wzStep - 1));
  if (st.skip) add('Pomiń kreator', wzFinish);
  first.focus();
  if (st.load) { const d = await st.load(); if (tok === wzShow.tok) $('wzB').innerHTML = st.body(d); }
}
wzShow.tok = 0;
async function wzFinish() {
  document.body.classList.remove('wz-open');
  if (!cfg.setupDone) { cfg.setupDone = true; await save(); }
  if (grid[r] && grid[r][c]) grid[r][c].focus({ preventScroll: true });
  startupUpdateCheck();
}
function openWizard() { wzBuild(); document.body.classList.add('wz-open'); wzShow(0); }
document.addEventListener('keydown', e => {
  if (!document.body.classList.contains('wz-open')) return;
  e.stopImmediatePropagation();
  const bs = [...$('wzBtns').children], i = bs.indexOf(document.activeElement);
  if (e.key === 'ArrowRight') { e.preventDefault(); wzShow(wzStep + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); wzShow(wzStep - 1); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = bs[Math.max(0, Math.min(bs.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]; if (n) n.focus(); }
}, true);

function closeSet() {
  document.body.classList.remove('settings-open'); stack = []; pageTok++;
  if (grid[r] && grid[r][c]) grid[r][c].focus({ preventScroll: true });
}

/* ---------- start ---------- */
(async () => {
  try { cfg = await (await fetch('/api/config')).json(); } catch (e) { cfg = {}; }
  try { const p = (localStorage.getItem('tvpos') || '').split(',').map(Number); if (p.length === 2 && !isNaN(p[0]) && !isNaN(p[1])) { r = p[0]; c = p[1]; } } catch (e) {}
  build();
  weather();
  INFO = await getJ('/api/info') || {};
  syncHomeKey();
  let justUpdated = null;
  try { justUpdated = localStorage.getItem('tvPostUpdate'); localStorage.removeItem('tvPostUpdate'); } catch (e) {}
  if (!cfg.setupDone) openWizard();
  else if (justUpdated) openPage(restartPage(INFO.version || justUpdated), PWR);
  else startupUpdateCheck();
  setInterval(startupUpdateCheck, 6 * 3600 * 1000);
})();
</script>
</body>
