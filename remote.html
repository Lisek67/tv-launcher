<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<meta name="mobile-web-app-capable" content="yes">
<title>Pilot</title>
<style>
:root { --bg:#0e0f12; --card:#1b1d22; --card2:#25282f; --fg:#f2f3f5; --mut:#9aa0ab; --acc:#7c9cff; --red:#e5534b; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.3 system-ui,sans-serif; overscroll-behavior:none; }
body { min-height:100dvh; padding:max(10px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom)); user-select:none; -webkit-user-select:none; }
.wrap { max-width:460px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
button { font:inherit; color:var(--fg); background:var(--card); border:0; border-radius:16px; min-height:56px; touch-action:manipulation; }
button:active, button.down { background:var(--card2); transform:scale(.97); }
.row { display:grid; gap:10px; }
.r3 { grid-template-columns:repeat(3,1fr); }
.r4 { grid-template-columns:repeat(4,1fr); }
.tabs { grid-template-columns:1fr 1fr; }
.tabs button { min-height:44px; color:var(--mut); }
.tabs button.on { background:var(--acc); color:#10131a; font-weight:600; }
.dpad { display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,76px); gap:10px; }
.dpad button { font-size:28px; min-height:0; }
.dpad .ok { background:var(--acc); color:#10131a; font-weight:700; font-size:20px; }
#pad { height:300px; border-radius:22px; background:linear-gradient(160deg,#1e2128,#14161b); border:1px solid #2a2e37; touch-action:none; display:flex; align-items:center; justify-content:center; color:var(--mut); text-align:center; padding:14px; font-size:14px; }
.seg { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.seg button { min-height:40px; font-size:14px; color:var(--mut); }
.seg button.on { color:var(--fg); outline:2px solid var(--acc); }
.txt { display:grid; grid-template-columns:1fr auto auto auto; gap:8px; }
input[type=text], input[type=tel] { font:inherit; color:var(--fg); background:var(--card); border:1px solid #2a2e37; border-radius:14px; padding:0 14px; min-height:52px; width:100%; user-select:text; -webkit-user-select:text; }
.txt button { min-width:56px; }
details { background:var(--card); border-radius:16px; padding:0 12px; }
summary { min-height:48px; display:flex; align-items:center; color:var(--mut); }
details .row { padding-bottom:12px; }
.danger { color:#ffb4ae; }
#toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#000c; padding:10px 16px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
#toast.on { opacity:1; }
#pair { display:none; margin-top:12vh; text-align:center; gap:14px; }
#pair h1 { font-size:24px; margin:0 0 4px; }
#pair p { color:var(--mut); margin:0 0 6px; }
#pair input { text-align:center; font-size:28px; letter-spacing:.35em; }
#pair button { background:var(--acc); color:#10131a; font-weight:700; }
.hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap" id="pair">
  <h1>Parowanie</h1>
  <p>Wpisz 6-cyfrowy PIN z ekranu komputera<br>(Ustawienia → Pilot na telefonie).</p>
  <input id="pin" type="tel" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
  <button id="pairBtn">Połącz</button>
</div>

<div class="wrap" id="main" style="display:none">
  <div class="row tabs">
    <button id="tabD" class="on">Strzałki</button>
    <button id="tabP">Gładzik</button>
  </div>

  <div id="vD" class="dpad">
    <span></span><button data-k="up" data-rep>▲</button><span></span>
    <button data-k="left" data-rep>◀</button><button data-k="ok" class="ok">OK</button><button data-k="right" data-rep>▶</button>
    <span></span><button data-k="down" data-rep>▼</button><span></span>
  </div>

  <div id="vP" class="hidden" style="display:none">
    <div class="seg" style="margin-bottom:10px">
      <button id="mSwipe" class="on">Przesuwanie</button>
      <button id="mMouse">Mysz</button>
    </div>
    <div id="pad"><span id="padHint">Przesuń palcem, aby nawigować.<br>Dotknij = OK. Dwa palce = Wstecz.</span></div>
  </div>

  <div class="row r4">
    <button data-k="back">⟵ Wstecz</button>
    <button data-k="home">⌂ Home</button>
    <button data-k="play">⏯</button>
    <button data-k="f11">⛶</button>
  </div>
  <div class="row r3">
    <button data-k="vdown" data-rep>🔉 −</button>
    <button data-k="mute">🔇</button>
    <button data-k="vup" data-rep>🔊 +</button>
  </div>
  <div class="row r4">
    <button data-k="prev">⏮</button>
    <button data-k="space">Spacja</button>
    <button data-k="switch">⇄ Okno</button>
    <button data-k="next">⏭</button>
  </div>

  <div class="txt">
    <input id="txt" type="text" placeholder="Wpisz tekst…" autocomplete="off" autocapitalize="off" enterkeyhint="send">
    <button id="send">Wyślij</button>
    <button data-k="backspace" data-rep>⌫</button>
    <button data-k="enter">↵</button>
  </div>

  <details>
    <summary>Zasilanie komputera</summary>
    <div class="row r3">
      <button data-p="suspend">Uśpij</button>
      <button data-p="reboot" class="danger">Restart</button>
      <button data-p="poweroff" class="danger">Wyłącz</button>
    </div>
  </details>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }
const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };

function showPair() { $('main').style.display = 'none'; $('pair').style.display = 'flex'; $('pair').style.flexDirection = 'column'; $('pin').focus(); }
function showMain() { $('pair').style.display = 'none'; $('main').style.display = 'flex'; }

async function api(path, body) {
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'X-TV': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}), keepalive: true });
    if (r.status === 401) { showPair(); return null; }
    const j = await r.json();
    if (j && j.ok === false && j.msg) toast(j.msg);
    return j;
  } catch (e) { toast('Brak połączenia z komputerem'); return null; }
}
const key = k => { buzz(); return api('/api/key', { k }); };

/* parowanie */
async function pair() {
  const j = await api('/auth', { pin: $('pin').value.trim() });
  if (j && j.ok) { showMain(); $('pin').value = ''; } else if (j) $('pin').value = '';
}
$('pairBtn').onclick = pair;
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') pair(); });
fetch('/api/me').then(r => r.json()).then(j => j.ok ? showMain() : showPair()).catch(() => showPair());

/* przyciski (z powtarzaniem po przytrzymaniu) */
document.querySelectorAll('[data-k]').forEach(b => {
  let t1, t2;
  const stop = () => { clearTimeout(t1); clearInterval(t2); b.classList.remove('down'); };
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); b.classList.add('down'); key(b.dataset.k);
    if (b.hasAttribute('data-rep')) t1 = setTimeout(() => { t2 = setInterval(() => key(b.dataset.k), 110); }, 380);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, stop));
  b.addEventListener('contextmenu', e => e.preventDefault());
});

/* zakładki */
function tab(d) {
  $('tabD').classList.toggle('on', d); $('tabP').classList.toggle('on', !d);
  $('vD').style.display = d ? 'grid' : 'none';
  $('vP').style.display = d ? 'none' : 'block'; $('vP').classList.remove('hidden');
}
$('tabD').onclick = () => tab(true); $('tabP').onclick = () => tab(false);

/* gładzik */
let mode = 'swipe';
function setMode(m) {
  mode = m; $('mSwipe').classList.toggle('on', m === 'swipe'); $('mMouse').classList.toggle('on', m === 'mouse');
  $('padHint').innerHTML = m === 'swipe'
    ? 'Przesuń palcem, aby nawigować.<br>Dotknij = OK. Dwa palce = Wstecz.'
    : 'Przesuń palcem, aby ruszać kursorem.<br>Dotknij = klik. Dwa palce: przewijanie,<br>dotknięcie dwoma = prawy klik.';
}
$('mSwipe').onclick = () => setMode('swipe'); $('mMouse').onclick = () => setMode('mouse');

const pad = $('pad'), ptrs = new Map();
let acc = { x: 0, y: 0 }, moved = 0, t0 = 0, multi = false, scrollAcc = 0, scrolled = 0;
let pend = { dx: 0, dy: 0 }, busy = false;
async function flush() {
  if (busy) return;
  const dx = Math.round(pend.dx), dy = Math.round(pend.dy);
  if (!dx && !dy) return;
  pend.dx -= dx; pend.dy -= dy; busy = true;
  await api('/api/move', { dx, dy });
  busy = false;
  if (Math.abs(pend.dx) >= 1 || Math.abs(pend.dy) >= 1) flush();
}
pad.addEventListener('pointerdown', e => {
  pad.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) { acc = { x: 0, y: 0 }; moved = 0; t0 = Date.now(); multi = false; scrollAcc = 0; scrolled = 0; } else multi = true;
});
pad.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size >= 2) {
    if (mode === 'mouse' && e.pointerId === [...ptrs.keys()][0]) {
      scrollAcc += dy;
      while (Math.abs(scrollAcc) >= 22) { const s = scrollAcc > 0 ? 1 : -1; scrollAcc -= s * 22; scrolled++; api('/api/scroll', { dy: s }); }
    }
    return;
  }
  if (mode === 'mouse') { pend.dx += dx * 1.8; pend.dy += dy * 1.8; flush(); return; }
  acc.x += dx; acc.y += dy;
  const T = 38;
  if (Math.abs(acc.x) >= T && Math.abs(acc.x) >= Math.abs(acc.y)) { key(acc.x > 0 ? 'right' : 'left'); acc.x -= Math.sign(acc.x) * T; acc.y = 0; }
  else if (Math.abs(acc.y) >= T) { key(acc.y > 0 ? 'down' : 'up'); acc.y -= Math.sign(acc.y) * T; acc.x = 0; }
});
const endP = e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size) return;
  const quick = Date.now() - t0 < 380;
  if (!multi && moved < 10 && quick) { if (mode === 'swipe') key('ok'); else { buzz(); api('/api/click', { b: 'l' }); } }
  else if (multi && moved < 24 && scrolled === 0 && quick) { if (mode === 'swipe') key('back'); else { buzz(); api('/api/click', { b: 'r' }); } }
};
pad.addEventListener('pointerup', endP); pad.addEventListener('pointercancel', endP);
pad.addEventListener('contextmenu', e => e.preventDefault());

/* tekst */
async function sendTxt() { const v = $('txt').value; if (!v) return; const j = await api('/api/text', { t: v }); if (j && j.ok) $('txt').value = ''; }
$('send').onclick = sendTxt;
$('txt').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendTxt(); } });

/* zasilanie */
const PL = { suspend: ['Uśpić komputer?', 'Usypiam…'], reboot: ['Uruchomić komputer ponownie?', 'Restartuję…'], poweroff: ['Wyłączyć komputer?', 'Wyłączam…'] };
document.querySelectorAll('[data-p]').forEach(b => b.onclick = async () => {
  const [q, m] = PL[b.dataset.p];
  if (!confirm(q)) return;
  toast(m); await api('/api/power', { action: b.dataset.p });
});
</script>
</body>
</html>
